name: Test Add-on

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'openai_realtime_voice_agent/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'openai_realtime_voice_agent/**'
      - '.github/workflows/tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        working-directory: openai_realtime_voice_agent
        run: PYTHONPATH=. python -m unittest discover -s tests -v
